<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shahlan Mourad - .NET developer in Stockholm, Sweden, building web applications with C#, ASP.NET Core, React and Angular.">
  <title>Shahlan Mourad - .NET Developer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <!-- Link preview (LinkedIn, Slack, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shahlan-mourad.github.io/">
  <meta property="og:title" content="Shahlan Mourad - .NET Developer">
  <meta property="og:description" content=".NET developer in Stockholm, Sweden, building web applications with C#, ASP.NET Core, React and Angular.">
  <meta property="og:image" content="https://avatars.githubusercontent.com/u/179486910?v=4">
  <meta name="twitter:card" content="summary">

  <!-- Preconnect for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Critical CSS inline (minimal) -->

    body { margin: 0; background: #0a0a0a; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    .page-loader { position: fixed; inset: 0; background: #0a0a0a; display: flex; align-items: center; justify-content: center; z-index: 9999; }
  </style>

  <!-- External stylesheets, loaded without blocking rendering -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.2.10/swiper-bundle.min.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css">

  <!-- Fallback for browsers without JavaScript -->
  <noscript>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11.2.10/swiper-bundle.min.css">
  </noscript>
</head>

<body>
  <!-- ========== SIDEBAR NAVIGATION ========== -->
  <nav class="sidebar" role="navigation" aria-label="Main navigation">
    <ul>
      <li>
        <a href="#home" class="sidebar-link" id="link-home" aria-label="Home section">
          <i class="bi bi-house" aria-hidden="true"></i>
        </a>
      </li>
      <li>
        <a href="#about" class="sidebar-link" id="link-about" aria-label="About section">
          <i class="bi bi-person" aria-hidden="true"></i>
        </a>
      </li>
      <li>
        <a href="#skills" class="sidebar-link" id="link-skills" aria-label="Skills section">
          <i class="bi bi-cpu" aria-hidden="true"></i>
        </a>
      </li>
      <li>
        <a href="#projects" class="sidebar-link" id="link-projects" aria-label="Projects section">
          <i class="bi bi-kanban" aria-hidden="true"></i>
        </a>
      </li>
      <li>
        <a href="#contact" class="sidebar-link" id="link-contact" aria-label="Contact section">
          <i class="bi bi-envelope" aria-hidden="true"></i>
        </a>
      </li>
    </ul>
  </nav>

  <!-- ========== MAIN CONTENT ========== -->
  <div class="container-fluid p-0 content-wrap">
    
    <!-- Home Section (Dynamically Generated) -->
    <section id="home" class="section" aria-labelledby="home-title"></section>
    
    <!-- About Section (Dynamically Generated) -->
    <section id="about" class="section" aria-labelledby="about-title"></section>
    
    <!-- Skills Section -->
    <section id="skills" class="section" aria-labelledby="skills-title">
      <div class="container">
        <h2 id="skills-title" class="mb-5 text-center">My Tech Stack</h2>
        <div id="skills-content" class="row"></div>
      </div>
    </section>
    
    <!-- Projects Section -->
    <section id="projects" class="section" aria-labelledby="projects-title">
      <div class="container">
        <h2 id="projects-title" class="mb-4">Latest Projects</h2>
        <div class="swiper my-coverflow" id="projects-swiper">
          <div class="swiper-wrapper" id="projects-swiper-wrapper"></div>
          <div class="swiper-pagination"></div>
        </div>
      </div>
    </section>
    
    <!-- Contact Section -->
    <section id="contact" class="section" aria-labelledby="contact-title">
      <div class="container">
        <div class="contact-section">
          <!-- Contact Information -->
          <div class="contact-info">
            <div>
              <span class="icon"><i class="bi bi-geo-alt" aria-hidden="true"></i></span>
              Stockholm, Sweden
            </div>
            <div>
              <span class="icon"><i class="bi bi-envelope" aria-hidden="true"></i></span>
              <a href="mailto:shahlan.mourad@gmail.com">shahlan.mourad@gmail.com</a>
            </div>
          </div>
          
          <!-- Contact Form -->
          <form class="contact-form-area" id="contact-form" action="https://formsubmit.co/ajax/shahlan.mourad@gmail.com" method="POST">
            <h2 id="contact-title" class="mb-0">Send me a message</h2>
            <div class="contact-form-row">
              <div class="contact-field">
                <label for="contact-name">Name</label>
                <input type="text" id="contact-name" name="name" autocomplete="name" required>
              </div>
              <div class="contact-field">
                <label for="contact-email">Email</label>
                <input type="email" id="contact-email" name="email" autocomplete="email" required>
              </div>
            </div>
            <div class="contact-field">
              <label for="contact-message">Message</label>
              <textarea id="contact-message" name="message" rows="5" required></textarea>
            </div>

            <!-- Hidden FormSubmit configuration -->
            <input type="hidden" name="_subject" value="New message from your portfolio">
            <input type="hidden" name="_template" value="table">
            <!-- Honeypot: hidden from people, spam bots fill it in and FormSubmit drops the message -->
            <input type="text" name="_honey" class="d-none" tabindex="-1" autocomplete="off" aria-hidden="true">

            <button type="submit">Send</button>
          </form>

          <!-- Status messages -->
          <div id="contact-success" class="alert alert-success mt-3 d-none" role="status">
            Thank you for your message!
          </div>
          <div id="contact-error" class="alert alert-danger mt-3 d-none" role="alert">
            Something went wrong. Please try again later or email me directly.
          </div>
        </div>
      </div>
    </section>
    
  </div>

  <!-- ========== FOOTER ========== -->
  <footer class="footer py-4" role="contentinfo">
    <div class="container">
      <div class="row align-items-center">
        
        <!-- Developer Info -->
        <div class="col-md-4 text-center text-md-start">
          <div class="developer-info">
            <img 
              src="https://github.com/Shahlan-Mourad.png" 
              alt="Shahlan Mourad profile picture" 
              class="profile-image mb-2 rounded-circle" 
              width="60"
              height="60"
              loading="lazy"
            />
            <h5 class="mb-1">Shahlan Mourad</h5>
            <p class="text">.NET Developer</p>
          </div>
        </div>
        
        <!-- Social Links -->
        <div class="col-md-4 text-center my-3 my-md-0">
          <div class="social-links">
            <a href="https://github.com/Shahlan-Mourad" target="_blank" rel="noopener noreferrer" class="social-link mx-2" aria-label="GitHub profile">
              <i class="bi bi-github" style="font-size: 1.5rem;" aria-hidden="true"></i>
            </a>
            <a href="mailto:shahlan.mourad@gmail.com" class="social-link mx-2" aria-label="Email contact">
              <i class="bi bi-envelope" style="font-size: 1.5rem;" aria-hidden="true"></i>
            </a>
            <a href="https://www.linkedin.com/in/shahlan-mourad-30256a335" target="_blank" rel="noopener noreferrer" class="social-link mx-2" aria-label="LinkedIn profile">
              <i class="bi bi-linkedin" style="font-size: 1.5rem;" aria-hidden="true"></i>
            </a>
          </div>
        </div>
        
        <!-- Copyright -->
        <div class="col-md-4 text-center text-md-end">
          <p class="mb-0">
            © <span id="footer-year"></span> 
            <span class="footer-credit">
              Built by Shahlan <i class="bi bi-code-slash footer-icon" aria-hidden="true"></i>
            </span>
            <br />
            <small class="text">All rights reserved</small>
          </p>
        </div>
        
      </div>
    </div>
  </footer>

  <!-- ========== EXTERNAL SCRIPTS ========== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11.2.10/swiper-bundle.min.js"></script>
  
  <!-- Custom Script -->
  <script src="script.js"></script>
</body>
</html>
